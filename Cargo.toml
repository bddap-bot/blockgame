[package]
name = "blockgame"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Minecraft-like voxel game: Bevy render/ECS, iroh host-authoritative multiplayer."
repository = "https://github.com/bddap-bot/blockgame"

[dependencies]
bevy = "0.18"
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bytes = "1"
# Copying the join ticket out of the game. `image-data` is off: a clipboard that carries
# pictures would drag in a whole image stack to move sixty-four characters of hex.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# A voxel world is meshing-bound and pointer-chasing-heavy: unoptimized dependency code
# turns a walkable world into a slideshow, so dev builds optimize deps hard and our own
# crate lightly (fast edit-compile-run for whoever is adding blocks tonight).
# `start_paused` runs the join-timeout test on a virtual clock instead of a real minute.
# Named here because a dependency of iroh happens to enable `test-util` for the whole
# graph, so without this the test compiles today and stops compiling the day they fix it.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
